# Mises à jour automatisées des dépendances.
# ⚠️ La configuration précédente était invalide (`package-ecosystem: ""`, valeur
#    vide) : Dependabot la rejetait silencieusement, aucune mise à jour n'était
#    proposée. Les écosystèmes réellement utilisés ici sont `docker` (les
#    images épinglées dans les fichiers compose) et `github-actions`.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Images Docker épinglées dans chaque module (traefik, monitoring, portainer).
  - package-ecosystem: "docker"
    directory: "/traefik"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/monitoring"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/portainer"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"

  # Actions GitHub épinglées dans .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
