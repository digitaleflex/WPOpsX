name: CI — Vérifications

# La CI précédente ne pouvait RIEN détecter : chaque étape était neutralisée
# (`continue-on-error: true`, `|| true`, `|| echo "[WARNING]"`) et le dernier job
# était tronqué en pleine ligne (le commentaire annonçait un scan bloquant, mais
# `exit-code` n'était jamais défini -> trivy sortait en code 0).
#
# Ici : la porte de vérification est le script `scripts/verify.sh`, exactement
# celui que les contributeurs exécutent en local. Ce qui suit est BLOQUANT.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Gate — YAML, Bash, Compose, config Traefik
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Installation des linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          python3 -m pip install --quiet --disable-pip-version-check yamllint==1.35.1

      - name: Versions des outils
        run: |
          yamllint --version
          shellcheck --version | head -n 3
          docker compose version

      - name: Porte de vérification
        run: ./scripts/verify.sh

  trivy:
    name: Scan sécurité Trivy (informatif, non bloquant)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Volontairement NON bloquant : le scan doit d'abord être trié (baseline).
      # Les résultats sont publiés dans l'onglet Security (SARIF) et peuvent
      # être rendus bloquants en passant `exit-code` à "1" une fois le tri fait.
      - name: Trivy (configuration IaC)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Publication des résultats (SARIF)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
